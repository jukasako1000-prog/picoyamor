<!DOCTYPE html>
<html lang="es" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico & Amor - Diversión Natural para tu Agapornis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        "primary": "#6c9371",
                        "primary-hover": "#56755a",
                        "accent": "#a3cb2a",
                        "background-light": "#F2EDE4",
                        "surface": "#ffffff",
                        "text-main": "#3F3D3C",
                        "text-muted": "#6c7a6e",
                        "wood-brown": "#8B5E3C",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "2xl": "2.5rem",
                        "3xl": "3rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        "soft": "0 10px 40px -10px rgba(63, 61, 60, 0.08)",
                        "hover": "0 20px 40px -10px rgba(63, 61, 60, 0.12)",
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .filled-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* SOLUCIÓN AL PROBLEMA DEL EMAIL GRIS/BLANCO */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #F2EDE4 inset !important;
            -webkit-text-fill-color: #3F3D3C !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
  }
}
</script>
    <link rel="stylesheet" href="/index.css">
    <script>
            // INTERCEPTOR DE SEGURIDAD PARA RECUPERACIÓN DE CONTRASEÑA
            (function () {
                try {
                    const url = window.location.href;
                    const hash = window.location.hash;
                    if (url.includes('access_token=') || url.includes('type=recovery') || hash.includes('type=recovery')) {
                        localStorage.setItem('pico_recovery_mode', 'true');
                        console.log('Token de recuperación interceptado y guardado.');
                    }
                } catch (e) { console.error('Error en interceptor:', e); }
            })();
    </script>
</head>

<body class="bg-background-light text-text-main transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
